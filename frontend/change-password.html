<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Change Password — CircuitCart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <nav class="navbar">
        <div class="navbar-inner">

            <a href="index.html" class="logo">
                <span class="dot"></span>
                CircuitCart
            </a>

            <div class="nav-links">

                <a href="index.html">
                    Shop
                </a>

                <a href="cart.html" class="nav-icon-link">
                    Cart
                    <span id="cart-badge" class="cart-badge">
                        0
                    </span>
                </a>

                <span id="nav-auth-slot"></span>

            </div>
        </div>
    </nav>


    <div class="form-page">

        <div class="form-card">

            <h1>Change Password</h1>

            <form id="change-password-form">

                <!-- Current Password -->

                <div class="form-group">

                    <label for="current-password">
                        Current Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="current-password" required />

                        <button type="button" class="password-toggle" data-target="current-password"
                            aria-label="Show password">
                            👁
                        </button>

                    </div>

                </div>


                <!-- New Password -->

                <div class="form-group">

                    <label for="new-password">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="new-password" minlength="6" required />

                        <button type="button" class="password-toggle" data-target="new-password"
                            aria-label="Show password">
                            👁
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="confirm-password" minlength="6" required />

                        <button type="button" class="password-toggle" data-target="confirm-password"
                            aria-label="Show password">
                            👁
                        </button>

                    </div>

                </div>


                <div class="form-error" id="change-password-error"></div>

                <div class="form-success" id="change-password-success"></div>


                <button type="submit" class="btn btn-primary btn-block">
                    Change Password
                </button>

            </form>


            <div class="form-footer-link">

                <a href="index.html">
                    ← Back to Shop
                </a>

            </div>

        </div>

    </div>


    <script src="js/main.js"></script>
    <script src="js/change-password.js"></script>

</body>

</html>
