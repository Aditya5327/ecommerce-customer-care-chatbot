<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order confirmed — CircuitCart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo"><span class="dot"></span>CircuitCart</a>
      <div class="nav-links">
        <a href="index.html">Shop</a>
        <a href="cart.html" class="nav-icon-link">
          Cart <span id="cart-badge" class="cart-badge">0</span>
        </a>
        <span id="nav-auth-slot"></span>
      </div>
    </div>
  </nav>

  <div class="success-page">
    <div class="success-icon">✓</div>
    <h1>Order confirmed</h1>
    <p>Your payment went through and your order is being processed.</p>
    <div class="order-id-tag" id="order-id-tag">Loading order ID...</div>
    <div>
      <a href="index.html" class="btn btn-primary">Continue shopping</a>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderNumber = params.get("orderNumber");
    document.getElementById("order-id-tag").textContent = orderNumber
      ? `Order #${orderNumber}`
      : "Order number unavailable";
  </script>
</body>
</html>
